<!--
  Wazuh Agent Baseline Configuration for Windows Server
  Optimized with XPath event channel queries for low EPS noise.
  File destination: C:\Program Files (x86)\ossec-agent\ossec.conf
-->
<ossec_config>
  <client>
    <server>
      <address><WAZUH_MANAGER_IP></address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
  </client>

  <!-- Client Buffer: Anti-saturation safeguard -->
  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- Windows File Integrity Monitoring (FIM) & Registry Tracking -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>

    <!-- Critical system paths (Realtime monitoring) -->
    <directories realtime="yes" check_all="yes">C:\Windows\System32\drivers\etc</directories>
    <directories realtime="yes" check_all="yes">C:\Windows\System32\GroupPolicy</directories>

    <!-- Registry Auto-Start and Persistence Locations -->
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services</windows_registry>

    <!-- Exclude volatile system caches & temp files -->
    <ignore>C:\Windows\Temp</ignore>
    <ignore>C:\Users\*\AppData\Local\Temp</ignore>
    <ignore type="sregex">.tmp$|.log$</ignore>
  </syscheck>

  <!-- ================================================================= -->
  <!-- BASELINE EVENT LOG COLLECTION (Targeted XPath Queries)            -->
  <!-- ================================================================= -->

  <!-- 1. Security Channel: High-Value Authentication and Account Operations -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>
      *[System[(
        EventID=1102 or
        EventID=4624 or
        EventID=4625 or
        EventID=4672 or
        EventID=4697 or
        EventID=4698 or
        EventID=4720 or
        EventID=4726 or
        EventID=4728 or
        EventID=4732 or
        EventID=4738 or
        EventID=7045
      )]]
    </query>
  </localfile>

  <!-- 2. System Channel: System Restarts, Cleared Logs, and Service Failures -->
  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
    <query>
      *[System[(
        EventID=104 or
        EventID=1074 or
        EventID=6005 or
        EventID=6006 or
        EventID=7034 or
        EventID=7036 or
        EventID=7045
      )]]
    </query>
  </localfile>

  <!-- 3. PowerShell Operational Channel: ScriptBlock Logging (Event ID 4104) -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
    <query>*[System[(EventID=4104)]]</query>
  </localfile>

  <!-- 4. Windows Defender / Antivirus Detections -->
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
    <query>*[System[(EventID=1116 or EventID=1117 or EventID=5001)]]</query>
  </localfile>

  <!-- 5. Sysmon Channel (if installed, captures process creation / LOLBins) -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Security Configuration Assessment (SCA) -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
  </sca>

  <!-- Inventory (required for Vulnerability Detection on the manager) -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>
  </wodle>
</ossec_config>
