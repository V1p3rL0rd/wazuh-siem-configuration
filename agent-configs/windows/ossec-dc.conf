<!--
  Wazuh Agent Configuration for Active Directory Domain Controllers (AD DS)
  Optimized for Kerberoasting, AS-REP Roasting, DCSync, and Privileged Group Auditing.
  File destination on DC: C:\Program Files (x86)\ossec-agent\ossec.conf
-->
<ossec_config>
  <client>
    <server>
      <address><WAZUH_MANAGER_IP></address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
  </client>

  <!-- Anti-saturation client buffer for High-Throughput Domain Controllers -->
  <client_buffer>
    <disabled>no</disabled>
    <queue_size>10000</queue_size>
    <events_per_second>1000</events_per_second>
  </client_buffer>

  <!-- FIM & NTDS Database Integrity Monitoring -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>

    <!-- Critical AD and System Paths -->
    <directories realtime="yes" check_all="yes">C:\Windows\System32\GroupPolicy</directories>
    <directories realtime="yes" check_all="yes">C:\Windows\SYSVOL\sysvol</directories>
    <directories realtime="yes" check_all="yes">C:\Windows\System32\drivers\etc</directories>

    <!-- Registry Persistence & Domain Controller Security Settings -->
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa</windows_registry>

    <!-- Exclude volatile Active Directory database transaction files from FIM -->
    <ignore>C:\Windows\NTDS\edb.log</ignore>
    <ignore>C:\Windows\NTDS\edbtmp.log</ignore>
    <ignore type="sregex">.log$|.tmp$</ignore>
  </syscheck>

  <!-- ================================================================= -->
  <!-- DOMAIN CONTROLLER EVENT LOG COLLECTION (Targeted XPath Queries)   -->
  <!-- ================================================================= -->

  <!-- 1. Security Channel: Kerberos, NTLM, DCSync, and Account Operations -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>
      *[System[(
        EventID=1102 or
        EventID=4624 or
        EventID=4625 or
        EventID=4662 or
        EventID=4672 or
        EventID=4697 or
        EventID=4698 or
        EventID=4720 or
        EventID=4722 or
        EventID=4724 or
        EventID=4725 or
        EventID=4726 or
        EventID=4728 or
        EventID=4732 or
        EventID=4738 or
        EventID=4756 or
        EventID=4768 or
        EventID=4769 or
        EventID=4771 or
        EventID=4776 or
        EventID=5136 or
        EventID=5141 or
        EventID=7045
      )]]
    </query>
  </localfile>

  <!-- 2. Sysmon Channel: Deep Process, LSASS, and Remote Thread Telemetry -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- 3. PowerShell Operational Channel: ScriptBlock Logging (Event ID 4104) -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
    <query>*[System[(EventID=4104)]]</query>
  </localfile>

  <!-- 4. Directory Service Log: Replication & NTDS Events -->
  <localfile>
    <location>Directory Service</location>
    <log_format>eventchannel</log_format>
    <query>*[System[(Level=1 or Level=2 or Level=3)]]</query>
  </localfile>

  <!-- 5. DNS Server Event Log (Active Directory Integrated DNS) -->
  <localfile>
    <location>DNS Server</location>
    <log_format>eventchannel</log_format>
    <query>*[System[(Level=1 or Level=2)]]</query>
  </localfile>

  <!-- 6. System Channel: System Health & Service Failures -->
  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
    <query>
      *[System[(
        EventID=104 or
        EventID=1074 or
        EventID=6005 or
        EventID=6006 or
        EventID=7034 or
        EventID=7036
      )]]
    </query>
  </localfile>

  <!-- Security Configuration Assessment (SCA) -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
  </sca>
</ossec_config>
