# Wazuh Manager Production Internal Tuning
# File destination: /var/ossec/etc/local_internal_options.conf

# 1. Remoted Queue Tuning (Prevents dropped UDP/TCP packets under traffic bursts)
remoted.rqueue_size=100000
remoted.recv_counter_flush=128

# 2. Analysis Engine Tuning
analysisd.rqueue_size=100000
analysisd.default_timeframe=360
analysisd.memory_limit=1024M

# 3. Integrator Daemon Tuning
integrator.max_threads=4

# 4. Monitord / Cleanup intervals
monitord.keep_log_days=31
monitord.rotate_log=1
