# Wazuh Manager internal tuning.
# setup.sh writes these options as a managed block into /var/ossec/etc/local_internal_options.conf
# (other lines of that file are kept). Option names are taken from Wazuh 4.x etc/internal_options.conf;
# the Wazuh default for every *_queue_size below is 16384.

# Analysis engine input queues (events from agents / FIM / Windows event channel)
analysisd.decode_event_queue_size=32768
analysisd.decode_syscheck_queue_size=32768
analysisd.decode_winevt_queue_size=32768

# Alerts writer queue
analysisd.alerts_queue_size=32768

# Days to keep rotated ossec.log files [0..500]
monitord.keep_log_days=31
