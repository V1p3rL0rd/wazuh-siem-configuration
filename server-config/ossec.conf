<!--
  Wazuh Manager reference configuration (sections changed by this project).
  setup.sh does NOT copy this file: it edits the existing /var/ossec/etc/ossec.conf in place.
  Use it as a reference only; a full ossec.conf also needs the default <indexer>, <auth>, <cluster>,
  <localfile> and other sections created by the Wazuh installer.
-->
<ossec_config>
  <!-- 1. Global Settings -->
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <!-- DISK OPTIMIZATION: Disable raw log dumping to save disk space -->
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <smtp_server>127.0.0.1</smtp_server>
    <email_from>wazuh@localhost</email_from>
    <email_to>recipient@localhost</email_to>
    <email_maxperhour>12</email_maxperhour>
    <email_log_summary>12</email_log_summary>
    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
  </global>

  <!-- 2. Remote Agent Communication Daemon (wazuh-remoted).
       queue_size is valid only for <connection>secure</connection>; in a syslog <remote> it
       prevents wazuh-remoted from starting. -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <!-- 3. Ruleset & Detection Engine (wazuh-analysisd) -->
  <ruleset>
    <!-- Default Wazuh rulesets -->
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>

    <!-- Custom decoders & rules: whole directories, so additional integration files are loaded too -->
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>

  <!-- 4. Telegram Integration (Alerts Level >= 10) -->
  <integration>
    <name>custom-telegram</name>
    <hook_url>https://api.telegram.org/botTELEGRAM_BOT_TOKEN/sendMessage</hook_url>
    <api_key>TELEGRAM_CHAT_ID</api_key>
    <level>10</level>
    <alert_format>json</alert_format>
  </integration>

  <!-- 5. Vulnerability Detector Subsystem -->
  <vulnerability-detection>
    <enabled>yes</enabled>
    <index-status>yes</index-status>
    <feed-update-interval>60m</feed-update-interval>
  </vulnerability-detection>

  <!-- 6. Syscheck (Manager Self-Monitoring) -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <directories realtime="yes" check_all="yes">/etc,/usr/bin,/usr/sbin</directories>
    <skip_nfs>yes</skip_nfs>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>
  </syscheck>
</ossec_config>
